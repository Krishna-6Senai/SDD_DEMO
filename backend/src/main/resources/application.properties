spring.application.name=timeoff
server.port=8080

# Overridden by SPRING_DATA_MONGODB_URI in the container; this value is for local development.
spring.data.mongodb.uri=mongodb://localhost:27017/timeoff

# Reported by /api/health so a deploy can be checked against what is actually running.
timeoff.version=0.1.0

# The leave year is the calendar year (BRL-10) and all employees are UK-based for this release
# (ASM-3), so the application runs in one zone rather than deriving it per request.
spring.jackson.time-zone=Europe/London

# Fail fast on an unknown property rather than silently ignoring a misspelled field in a request.
spring.jackson.deserialization.fail-on-unknown-properties=true
